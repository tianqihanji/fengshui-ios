name: FengShuiCompass
options:
  bundleIdPrefix: com.tianqi
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""

targets:
  FengShuiCompass:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: FengShuiCompass
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.tianqi.FengShuiCompass
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES

schemes:
  FengShuiCompass:
    build:
      targets:
        FengShuiCompass: all
    run:
      config: Debug
    archive:
      config: Release
